<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Background Music - Game Settings UI</title>
  <!-- Google Fonts: Lora & Merriweather cho phong cách chữ Serif cổ điển giống ảnh mẫu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --u: 1vmin; /* Đơn vị tỷ lệ động co giãn theo kích thước màn hình */
      --bg-top: #567ee6;
      --bg-mid: #7ea0f0;
      --bg-bottom: #b5caf8;
      --navy-dark: #0c1446;
      --card-glass: rgba(255, 255, 255, 0.24);
      --search-glass: rgba(88, 118, 212, 0.30);
      --btn-indigo: #4644b8;
      --btn-indigo-active: #2c2a8a;
      --toggle-track-on: rgba(182, 204, 248, 0.65);
      --toggle-knob-on: #5079c6;
      --toggle-track-off: rgba(130, 150, 200, 0.45);
      --toggle-knob-off: #7c91c2;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
      font-family: 'Lora', Georgia, serif;
    }

    /* Khung màn hình game phủ kín và co giãn theo mọi kích thước màn hình */
    .game-screen {
      width: 100%;
      height: 100dvh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
      display: flex;
      flex-direction: column;
      padding: calc(var(--u) * 3.4) calc(var(--u) * 3.8);
      padding-bottom: max(calc(var(--u) * 3.2), env(safe-area-inset-bottom));
      padding-top: max(calc(var(--u) * 3.6), env(safe-area-inset-top));
      gap: calc(var(--u) * 2.6);
      position: relative;
      overflow: hidden;
    }

    /* Font chữ tiêu đề đậm phong cách Slab/Serif giống ảnh */
    .serif-heading {
      font-family: 'Merriweather', 'Lora', serif;
      color: var(--navy-dark);
      letter-spacing: calc(var(--u) * -0.01);
    }

    /* Thanh Header trên cùng */
    .top-header {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 2.2);
      padding: calc(var(--u) * 0.6) calc(var(--u) * 0.4);
      flex-shrink: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--u) * 7.2);
      height: calc(var(--u) * 7.2);
      border-radius: calc(var(--u) * 2.2);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--navy-dark);
      transition: transform 0.15s ease, background-color 0.2s ease;
      padding: 0;
    }

    .back-btn:active {
      transform: scale(0.88);
      background-color: rgba(255, 255, 255, 0.2);
    }

    .back-btn svg {
      width: calc(var(--u) * 5);
      height: calc(var(--u) * 5);
    }

    .header-title {
      font-size: calc(var(--u) * 4.5);
      font-weight: 900;
      margin: 0;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Thẻ Bật / Tắt (Master Toggle Card) */
    .toggle-card {
      background: var(--card-glass);
      border-radius: calc(var(--u) * 3.8);
      padding: calc(var(--u) * 2.6) calc(var(--u) * 4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      backdrop-filter: blur(calc(var(--u) * 1.1));
      -webkit-backdrop-filter: blur(calc(var(--u) * 1.1));
      box-shadow: 0 calc(var(--u) * 0.7) calc(var(--u) * 2.6) rgba(20, 40, 100, 0.05);
    }

    .toggle-label {
      font-size: calc(var(--u) * 4);
      font-weight: 900;
      color: var(--navy-dark);
      line-height: 1.2;
      transition: opacity 0.25s ease;
    }

    /* Nút gạt Toggle Switch co giãn theo --u */
    .switch-btn {
      --sw-w: calc(var(--u) * 12.8);
      --sw-h: calc(var(--u) * 6.8);
      --sw-pad: calc(var(--u) * 0.55);
      --knob-size: calc(var(--u) * 5.7);
      position: relative;
      width: var(--sw-w);
      height: var(--sw-h);
      border-radius: 999px;
      background-color: var(--toggle-track-on);
      border: none;
      cursor: pointer;
      padding: var(--sw-pad);
      transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .switch-btn[aria-checked="false"] {
      background-color: var(--toggle-track-off);
    }

    .switch-knob {
      width: var(--knob-size);
      height: var(--knob-size);
      border-radius: 50%;
      background-color: var(--toggle-knob-on);
      box-shadow: 0 calc(var(--u) * 0.35) calc(var(--u) * 1) rgba(12, 20, 70, 0.22);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease;
      transform: translateX(calc(var(--sw-w) - var(--knob-size) - var(--sw-pad) * 2));
    }

    .switch-btn[aria-checked="false"] .switch-knob {
      transform: translateX(0);
      background-color: var(--toggle-knob-off);
    }

    /* Khung danh sách nhạc nền chính (chiếm phần không gian còn lại) */
    .music-panel {
      flex: 1;
      min-height: 0;
      background: var(--card-glass);
      border-radius: calc(var(--u) * 4.6);
      padding: calc(var(--u) * 3.2) calc(var(--u) * 3.4) 0 calc(var(--u) * 3.4);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(calc(var(--u) * 1.1));
      -webkit-backdrop-filter: blur(calc(var(--u) * 1.1));
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .music-panel.is-muted {
      opacity: 0.62;
    }

    .section-title {
      font-size: calc(var(--u) * 3.3);
      font-weight: 900;
      margin: 0 0 calc(var(--u) * 2.2) calc(var(--u) * 0.4);
      line-height: 1.2;
      flex-shrink: 0;
    }

    /* Thanh tìm kiếm bo tròn */
    .search-box {
      width: 100%;
      height: calc(var(--u) * 7.6);
      background: var(--search-glass);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 calc(var(--u) * 2.8);
      gap: calc(var(--u) * 2);
      margin-bottom: calc(var(--u) * 2.4);
      flex-shrink: 0;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      background: rgba(88, 118, 212, 0.42);
      box-shadow: 0 0 0 calc(var(--u) * 0.35) rgba(12, 20, 70, 0.25);
    }

    .search-box svg {
      width: calc(var(--u) * 3.6);
      height: calc(var(--u) * 3.6);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--navy-dark);
      font-family: 'Lora', serif;
      font-size: calc(var(--u) * 2.95);
      font-weight: 600;
      user-select: text;
    }

    .search-input::placeholder {
      color: rgba(12, 20, 70, 0.45);
      font-weight: 500;
    }

    .clear-search-btn {
      background: rgba(12, 20, 70, 0.15);
      border: none;
      color: var(--navy-dark);
      width: calc(var(--u) * 3.8);
      height: calc(var(--u) * 3.8);
      border-radius: 50%;
      font-size: calc(var(--u) * 2.2);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .clear-search-btn.visible {
      display: flex;
    }

    /* Danh sách bài hát có thanh cuộn mượt */
    .song-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 2.2);
      padding-bottom: calc(var(--u) * 3.4);
      padding-right: calc(var(--u) * 0.4);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .song-list::-webkit-scrollbar {
      display: none;
    }

    /* Từng dòng bài hát */
    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--u) * 2.4);
      padding: calc(var(--u) * 1) calc(var(--u) * 1.2);
      border-radius: calc(var(--u) * 2.6);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .song-item.is-playing {
      background: rgba(255, 255, 255, 0.22);
      box-shadow: 0 calc(var(--u) * 0.4) calc(var(--u) * 1.8) rgba(70, 68, 184, 0.12);
    }

    /* Ảnh bìa vuông cổ điển màu vàng kem */
    .album-cover {
      width: calc(var(--u) * 9.2);
      height: calc(var(--u) * 9.2);
      border-radius: calc(var(--u) * 1.7);
      flex-shrink: 0;
      background: linear-gradient(145deg, #ead8b1 0%, #cfb682 100%);
      border: calc(var(--u) * 0.36) solid #2d261e;
      box-shadow: inset 0 0 0 calc(var(--u) * 0.28) rgba(255, 248, 230, 0.6), 0 calc(var(--u) * 0.4) calc(var(--u) * 0.9) rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Thông tin tên bài hát & tác giả */
    .song-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: calc(var(--u) * 0.4);
    }

    .song-title {
      color: #ffffff;
      font-family: 'Lora', serif;
      font-size: calc(var(--u) * 3.15);
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.4) rgba(25, 45, 110, 0.18);
    }

    .song-meta {
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Lora', serif;
      font-size: calc(var(--u) * 2.45);
      font-weight: 500;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1.2);
    }

    /* Nút Play tròn màu xanh chàm đậm */
    .play-btn {
      width: calc(var(--u) * 7.2);
      height: calc(var(--u) * 7.2);
      border-radius: 50%;
      background-color: var(--btn-indigo);
      border: none;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 calc(var(--u) * 0.5) calc(var(--u) * 1.4) rgba(30, 28, 110, 0.25);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
    }

    .play-btn svg {
      width: calc(var(--u) * 2.8);
      height: calc(var(--u) * 2.8);
    }

    .play-btn:hover {
      background-color: #3b39a3;
    }

    .play-btn:active {
      transform: scale(0.86);
    }

    .play-btn.active {
      background-color: var(--btn-indigo-active);
      box-shadow: 0 0 0 calc(var(--u) * 0.55) rgba(255, 255, 255, 0.45);
    }

    /* Hiệu ứng sóng nhạc nhỏ khi đang phát */
    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: calc(var(--u) * 0.4);
      height: calc(var(--u) * 2);
      margin-left: calc(var(--u) * 0.6);
    }

    .equalizer span {
      width: calc(var(--u) * 0.4);
      background-color: #ffffff;
      border-radius: calc(var(--u) * 0.2);
      animation: eqBounce 0.8s infinite ease-in-out;
    }

    .equalizer span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .equalizer span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes eqBounce {
      0%, 100% { height: calc(var(--u) * 0.6); }
      50% { height: calc(var(--u) * 2); }
    }

    /* Thông báo Toast nổi trong game */
    .game-toast {
      position: absolute;
      bottom: calc(var(--u) * 4);
      left: 50%;
      transform: translateX(-50%) translateY(calc(var(--u) * 3.5));
      background: rgba(12, 20, 70, 0.9);
      color: #ffffff;
      padding: calc(var(--u) * 1.8) calc(var(--u) * 3.4);
      border-radius: 999px;
      font-size: calc(var(--u) * 2.6);
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 50;
      box-shadow: 0 calc(var(--u) * 1.4) calc(var(--u) * 3.6) rgba(0, 0, 0, 0.25);
    }

    .game-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      text-align: center;
      color: var(--navy-dark);
      opacity: 0.7;
      padding: calc(var(--u) * 4.5) calc(var(--u) * 2.4);
      font-size: calc(var(--u) * 2.9);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Màn hình chính của Game UI -->
  <main class="game-screen" role="region" aria-label="Cài đặt nhạc nền">
    
    <!-- 1. Thanh tiêu đề & nút quay lại -->
    <header class="top-header">
      <button id="backBtn" class="back-btn" aria-label="Quay lại">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0c1446" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 4 7 12 16 20"></polyline>
        </svg>
      </button>
      <h1 class="serif-heading header-title">Background music</h1>
    </header>

    <!-- 2. Thẻ Bật / Tắt tổng -->
    <section class="toggle-card">
      <span id="toggleStatusText" class="serif-heading toggle-label">Bật</span>
      <button id="masterSwitch" class="switch-btn" role="switch" aria-checked="true" aria-label="Bật hoặc tắt nhạc nền">
        <span class="switch-knob"></span>
      </button>
    </section>

    <!-- 3. Bảng danh sách Nhạc nền -->
    <section id="musicPanel" class="music-panel">
      <h2 class="serif-heading section-title">Nhạc nền:</h2>

      <!-- Thanh tìm kiếm -->
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0c1446" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"></circle>
          <line x1="20.5" y1="20.5" x2="16.35" y2="16.35"></line>
        </svg>
        <input 
          id="searchInput" 
          class="search-input" 
          type="text" 
          placeholder="Tìm kiếm bài hát..." 
          autocomplete="off"
          aria-label="Tìm kiếm nhạc nền"
        />
        <button id="clearSearchBtn" class="clear-search-btn" aria-label="Xóa tìm kiếm">✕</button>
      </div>

      <!-- Danh sách các bài hát có thể cuộn -->
      <div id="songListContainer" class="song-list" role="list">
        <!-- Các mục bài hát sẽ được render tự động bằng JS -->
      </div>
    </section>

    <!-- Toast phản hồi trong game -->
    <div id="gameToast" class="game-toast" role="status" aria-live="polite"></div>

  </main>

  <script>
    // Đồng bộ tỷ lệ co giãn --u theo kích thước màn hình
    const REF_W = 360;
    const REF_H = 800;

    function syncScreenRatio() {
      const vw = window.innerWidth;
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const unit = Math.min(vw / REF_W, vh / REF_H) * 5.2;
      document.documentElement.style.setProperty("--u", `${unit.toFixed(4)}px`);
    }

    window.addEventListener("resize", syncScreenRatio);
    window.addEventListener("orientationchange", syncScreenRatio);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncScreenRatio);
    }
    syncScreenRatio();

    // Dữ liệu danh sách nhạc nền giống hệt thiết kế mẫu
    const SONGS_DATA = [
      { id: 1, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 261.63 },
      { id: 2, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 293.66 },
      { id: 3, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 329.63 },
      { id: 4, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 349.23 },
      { id: 5, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 392.00 },
      { id: 6, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 440.00 },
      { id: 7, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 493.88 },
      { id: 8, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 523.25 },
      { id: 9, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 261.63 },
      { id: 10, title: "Sốt nhẹ", author: "tác giả", duration: "03:00", baseFreq: 329.63 }
    ];

    let isMusicEnabled = true;
    let currentPlayingId = null;
    let searchQuery = "";
    let toastTimer = null;

    let audioCtx = null;
    let bgmInterval = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playAmbientNote(freq) {
      if (!audioCtx || !isMusicEnabled) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.06, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 1.45);
      } catch (e) {}
    }

    function startBgmLoop(song) {
      stopBgmLoop();
      if (!isMusicEnabled || !song) return;
      initAudio();

      const scale = [1, 1.25, 1.5, 1.875, 1.5, 1.25];
      let step = 0;
      playAmbientNote(song.baseFreq * scale[0]);

      bgmInterval = setInterval(() => {
        if (!isMusicEnabled || currentPlayingId !== song.id) {
          stopBgmLoop();
          return;
        }
        step = (step + 1) % scale.length;
        playAmbientNote(song.baseFreq * scale[step]);
      }, 950);
    }

    function stopBgmLoop() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function showToast(message) {
      const toastEl = document.getElementById("gameToast");
      toastEl.textContent = message;
      toastEl.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2000);
    }

    function getVintageAlbumSVG() {
      return `
        <svg width="100%" height="100%" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="42" height="42" rx="4" fill="none" stroke="#5c4b32" stroke-width="1"/>
          <path d="M10 16 L38 16 M10 32 L38 32" stroke="#5c4b32" stroke-width="1" stroke-dasharray="2 1"/>
          <rect x="8" y="18" width="32" height="12" rx="2" fill="#d9c294" stroke="#3a2e1e" stroke-width="1.2"/>
          <text x="24" y="26.5" font-family="Georgia, serif" font-size="7.5" font-weight="bold" fill="#2c2216" text-anchor="middle">Vintage</text>
          <circle cx="14" cy="11" r="1.3" fill="#4a3c28"/>
          <circle cx="24" cy="11" r="1.5" fill="#4a3c28"/>
          <circle cx="34" cy="11" r="1.3" fill="#4a3c28"/>
          <rect x="17" y="36" width="14" height="2.2" rx="1" fill="#4a3c28"/>
        </svg>
      `;
    }

    function renderSongList() {
      const container = document.getElementById("songListContainer");
      const normalizedQuery = searchQuery.trim().toLowerCase();

      const filteredSongs = SONGS_DATA.filter(song =>
        song.title.toLowerCase().includes(normalizedQuery) ||
        song.author.toLowerCase().includes(normalizedQuery)
      );

      if (filteredSongs.length === 0) {
        container.innerHTML = `<div class="empty-state">Không tìm thấy bài hát phù hợp</div>`;
        return;
      }

      container.innerHTML = filteredSongs.map(song => {
        const isPlaying = isMusicEnabled && currentPlayingId === song.id;
        return `
          <div class="song-item ${isPlaying ? "is-playing" : ""}" role="listitem" data-id="${song.id}">
            <div class="album-cover" aria-hidden="true">
              ${getVintageAlbumSVG()}
            </div>

            <div class="song-info">
              <div class="song-title">${song.title}</div>
              <div class="song-meta">
                <span>${song.author} ${song.duration}</span>
                ${isPlaying ? `
                  <span class="equalizer" aria-hidden="true">
                    <span></span><span></span><span></span>
                  </span>
                ` : ""}
              </div>
            </div>

            <button 
              class="play-btn ${isPlaying ? "active" : ""}" 
              data-play-id="${song.id}"
              aria-label="${isPlaying ? "Tạm dừng" : "Phát"} ${song.title}"
            >
              ${isPlaying ? `
                <svg viewBox="0 0 24 24" fill="#0c1446">
                  <rect x="5" y="4" width="5" height="16" rx="1.5"></rect>
                  <rect x="14" y="4" width="5" height="16" rx="1.5"></rect>
                </svg>
              ` : `
                <svg viewBox="0 0 24 24" fill="#0c1446" style="margin-left: calc(var(--u) * 0.25);">
                  <polygon points="5,3 20,12 5,21"></polygon>
                </svg>
              `}
            </button>
          </div>
        `;
      }).join("");
    }

    const masterSwitch = document.getElementById("masterSwitch");
    const toggleStatusText = document.getElementById("toggleStatusText");
    const musicPanel = document.getElementById("musicPanel");

    masterSwitch.addEventListener("click", () => {
      isMusicEnabled = !isMusicEnabled;
      masterSwitch.setAttribute("aria-checked", String(isMusicEnabled));
      toggleStatusText.textContent = isMusicEnabled ? "Bật" : "Tắt";

      if (isMusicEnabled) {
        musicPanel.classList.remove("is-muted");
        showToast("Đã bật nhạc nền");
        if (currentPlayingId !== null) {
          const song = SONGS_DATA.find(s => s.id === currentPlayingId);
          startBgmLoop(song);
        }
      } else {
        musicPanel.classList.add("is-muted");
        stopBgmLoop();
        showToast("Đã tắt nhạc nền");
      }
      renderSongList();
    });

    document.getElementById("songListContainer").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-play-id]");
      if (!btn) return;

      const songId = Number(btn.getAttribute("data-play-id"));
      const song = SONGS_DATA.find(s => s.id === songId);
      if (!song) return;

      if (!isMusicEnabled) {
        isMusicEnabled = true;
        masterSwitch.setAttribute("aria-checked", "true");
        toggleStatusText.textContent = "Bật";
        musicPanel.classList.remove("is-muted");
      }

      if (currentPlayingId === songId) {
        currentPlayingId = null;
        stopBgmLoop();
        showToast(`Đã dừng: ${song.title}`);
      } else {
        currentPlayingId = songId;
        startBgmLoop(song);
        showToast(`Đang phát: ${song.title} #${song.id}`);
      }
      renderSongList();
    });

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("visible", searchQuery.length > 0);
      renderSongList();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchQuery = "";
      searchInput.value = "";
      clearSearchBtn.classList.remove("visible");
      searchInput.focus();
      renderSongList();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      showToast("Quay lại màn hình cài đặt chính");
    });

    renderSongList();
  </script>
</body>
</html>
